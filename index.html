<!doctype html>
<!-- Accessibility: lang tells screen readers which language to read the page in -->
<html lang="en" data-bs-theme="dark">
  <head>
    <!-- Accessibility: a unique page title is announced first by screen readers -->
    <title>Home | Josh Harris</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Accessibility: light/dark switch so users can change the contrast -->
    <script src="theme.js"></script>

    <!-- Site colors: black background, white text -->
    <link href="styles.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Accessibility: skip link lets keyboard and screen reader users jump past the navbar -->
    <a class="visually-hidden-focusable" href="#main-content"
      >Skip to main content</a
    >

    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav", function () {
        // Accessibility: mark the current page's link so screen readers announce it
        var page = location.pathname.split("/").pop() || "index.html";
        $('#site-nav a[href="' + page + '"]')
          .addClass("active")
          .attr("aria-current", "page");
        // Accessibility: make the contrast button's text match the saved theme
        setTheme(localStorage.getItem("theme") || "dark");
      });
    </script>

    <!-- Accessibility: the main landmark holds the page content inside a Bootstrap container -->
    <main id="main-content" class="container">
      <!-- Profile photo: equal width and height plus rounded-circle makes it a circle -->
      <!-- Accessibility: alt text describes the photo for people who cannot see it -->
      <img
        src="images/profile.jpg"
        alt="Josh Harris standing on a beach in a cap, sunglasses, and blue hoodie"
        width="250"
        height="250"
        class="rounded-circle object-fit-cover d-block my-4"
      />
      <h1>Hello my name is Josh Harris</h1>

      <!-- About Me card: short intro plus a list of things I like to do -->
      <section class="card my-4" aria-labelledby="about-heading">
        <div class="card-body">
          <h2 id="about-heading" class="card-title">About Me</h2>
          <p class="card-text">
            I am studying Cybersecurity at Metropolitan State University of
            Denver. Here are some of the things I like to do:
          </p>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">Going on hikes</li>
          <li class="list-group-item">
            Playing basketball, tennis, and pickleball
          </li>
          <li class="list-group-item">Spending time with family and friends</li>
          <li class="list-group-item">
            Traveling
            <!-- Travel photos: side by side, wrapping to stack on small screens; img-fluid lets them shrink to fit -->
            <!-- Accessibility: figure ties the visible caption to the photo, and alt text describes it -->
            <div class="d-flex flex-wrap gap-3 mt-3">
              <figure class="figure mb-0 travel-photo">
                <img
                  src="images/disneyland-paris.jpg"
                  alt="Five people standing arm in arm by a lake at Disneyland Paris, with a blue and white striped balloon behind them"
                  width="400"
                  height="300"
                  class="figure-img img-fluid rounded"
                />
                <figcaption class="figure-caption">
                  Some of my siblings and I at the Paris Disneyland.
                </figcaption>
              </figure>
              <figure class="figure mb-0 travel-photo">
                <img
                  src="images/alaska.jpg"
                  alt="A large group of people in jackets and hats smiling on the bow of a boat in icy water, with a blue glacier and mountains behind them"
                  width="400"
                  height="300"
                  class="figure-img img-fluid rounded"
                />
                <figcaption class="figure-caption">
                  Family trip to Alaska with family friends.
                </figcaption>
              </figure>
            </div>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
